# The local stack's load balancer: layer 4, round robin, no session
# persistence, probing each worker's /health/ready like the Azure load
# balancer does. It never looks inside connections, so it passes TLS
# through unchanged once workers serve it.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend api
    bind :8443
    default_backend workers

backend workers
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 5s fall 2 rise 1
    server worker1 worker1:8443 check
    server worker2 worker2:8443 check
    server worker3 worker3:8443 check
