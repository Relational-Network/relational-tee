#
# Pins the exact Rust toolchain for every build of this repo; reproducible
# builds depend on it. `rust-src` is for rust-analyzer.
#
# To update: change `channel` here and `rust-version` in Cargo.toml together.

[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-src"]
