# Keep each ignore in osv-scanner.toml too, with the same reason.
[advisories]
ignore = [
    # bincode 1 is unmaintained and has no fixed release. The worker serializes
    # Solana transactions with it, to send them and to store them for retries,
    # and Solana's crates depend on it; a replacement must keep that wire
    # format. Review by 2027-01-12, when osv-scanner.toml's ignore expires.
    "RUSTSEC-2025-0141",
    # zip 3 extracts SUID/SGID bits and symbolic links from an archive
    # unchecked. Only utoipa-swagger-ui's build script uses it, to unpack the
    # Swagger UI archive of utoipa-swagger-ui-vendored, which Cargo.lock pins
    # by checksum, and only for the dev-only swagger-ui feature; release
    # builds contain neither. No utoipa-swagger-ui release uses zip 9 or
    # later. Review by 2027-01-19, when osv-scanner.toml's ignores expire.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
