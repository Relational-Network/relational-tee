# Keep each ignore in osv-scanner.toml too, with the same reason.
[advisories]
ignore = [
    # bincode 1 is unmaintained and has no fixed release. The worker serializes
    # Solana transactions with it, to send them and to store them for retries,
    # and Solana's crates depend on it; a replacement must keep that wire
    # format. Review by 2027-01-12, when osv-scanner.toml's ignore expires.
    "RUSTSEC-2025-0141",
]
