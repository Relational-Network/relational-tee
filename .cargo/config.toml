# Every build reads this file, including the reproducible release build, so it
# holds no machine-specific settings. Put those (for example
# `build.rustc-wrapper = "sccache"`) in ~/.cargo/config.toml or the dev shell.

# Analysis tables are built and queried on several threads at once, and
# SQLite's process-wide memory statistics would put all their allocations
# behind one mutex.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"

[alias]
dev-check = "check --features dev"
dev-build = "build --features dev"
dev-test = "test --features dev"

# Dev and test builds favour compile and link speed: line tables only for our
# code (backtraces keep file and line), no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
