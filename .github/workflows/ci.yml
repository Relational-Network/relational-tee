# Every job gets its toolchain from the Nix flake, which pins Rust through
# rust-toolchain.toml, so CI and local builds can't drift apart.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates (fmt, clippy, tests, banned crates, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31
      # cargo audit needs the advisory database, so it runs outside the Nix
      # sandbox, in the dev shell. deny-crates fails if rsa or openssl-sys
      # appears in the dependency graph.
      - name: just check
        run: nix develop --command just check

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  image:
    name: Build the x86_64-linux image
    runs-on: ubuntu-latest
    needs: [gates, flake-check]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build --print-build-logs .#packages.x86_64-linux.image
      - name: Record the image hash
        run: |
          {
            echo '## Image'
            echo '```'
            echo "Store path: $(readlink result)"
            echo "SHA-256:    $(sha256sum result | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
