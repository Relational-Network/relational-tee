# CI
#
# ⚠️ NO SGX HARDWARE — GitHub Actions runners cannot run the enclave.
# This workflow handles:
#   - Lint (cargo fmt, clippy) and unit tests
#   - Security audit (cargo audit)
#   - Dockerfile lint (hadolint)
#   - Docker image build + sign (build-time signing via --mount=type=secret)
#     - On push to staging: pushed to GHCR, measurements printed to job summary
#     - On pull_request: built locally for verification only (not pushed)
#   - MRENCLAVE verification against measurements.toml
#
# For full SGX testing including RA-TLS attestation, run on an SGX VM:
#   make RA_TYPE=dcap
#   make test-attest

name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      force_docker:
        description: 'Force Docker image build even if no docker-related files changed'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Path filter ────────────────────────────────────────────────────────────
  # Skip expensive jobs when only docs/CI config changed.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            docker:
              - 'docker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - '*.manifest.template'
              - 'measurements.toml'
              - 'Makefile'
            config:
              - 'scripts/**'
              - 'docker/Dockerfile'

  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      # The repo's .cargo/config.toml sets `rustc-wrapper = "sccache"` for local
      # dev. sccache isn't installed on CI runners, so leaving it set makes cargo
      # fail with "could not execute process `sccache ...` (No such file or
      # directory)". Unset it here (an empty value disables the wrapper), mirroring
      # what docker/Dockerfile does. Swatinem/rust-cache already handles caching.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.8.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        # Note: We use P-256 ECDSA only (no RSA) to avoid vulnerabilities like
        # RUSTSEC-2023-0071. The jsonwebtoken crate is configured with only the
        # "p256" feature to exclude RSA dependencies entirely.

  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.config == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate systemd unit files
        run: |
          validate_unit() {
            local file=$1
            echo "Validating $file..."
            systemd-analyze verify "$file" || echo "Warning: systemd-analyze may report issues due to missing runtime dependencies"
            for section in '[Unit]' '[Service]' '[Install]' '[Timer]'; do
              # [Service] and [Timer] are type-specific; only check relevant ones
              case "$section" in
                '[Service]') grep -q '\[Service\]' "$file" 2>/dev/null || true ;;
                '[Timer]')   grep -q '\[Timer\]'   "$file" 2>/dev/null || true ;;
                *)
                  if ! grep -q "$section" "$file"; then
                    echo "ERROR: Missing $section in $file"
                    exit 1
                  fi
                  ;;
              esac
            done
            echo "✓ $file passed"
          }

          validate_unit scripts/enclave.service
          validate_unit scripts/health-check.service
          validate_unit scripts/health-check.timer

      - name: Validate health-check script
        run: |
          echo "Checking scripts/health-check.sh..."
          # Verify shebang
          head -1 scripts/health-check.sh | grep -q '^#!/bin/bash' || {
            echo "ERROR: Missing bash shebang"
            exit 1
          }
          # Syntax check
          bash -n scripts/health-check.sh
          echo "✓ health-check.sh syntax valid"
          # Verify deploy-lock support
          grep -q '.deploying' scripts/health-check.sh || {
            echo "ERROR: health-check.sh missing deploy-lock support"
            exit 1
          }
          echo "✓ deploy-lock support present"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

      - name: Validate shell scripts
        run: |
          sh -n docker/start.sh
          sh -n docker/restart_aesm.sh

  build-docker:
    name: Build & Sign Docker Image
    runs-on: ubuntu-latest
    needs: [changes, check, security, validate-config]
    if: |
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.validate-config.result == 'success' || needs.validate-config.result == 'skipped') &&
      (needs.changes.outputs.docker == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_docker))
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ghcr.io/relational-network/relational-sdk:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare signing key
        env:
          ENCLAVE_SIGNING_KEY: ${{ secrets.ENCLAVE_SIGNING_KEY }}
        run: |
          umask 077
          printenv ENCLAVE_SIGNING_KEY > "$RUNNER_TEMP/enclave-key.pem"

      - name: Validate signing key
        run: |
          KEY="$RUNNER_TEMP/enclave-key.pem"

          # Must be a valid RSA private key (openssl rsa fails for non-RSA keys)
          if ! openssl rsa -in "$KEY" -check -noout 2>/dev/null; then
            echo "::error::Signing key is not a valid RSA private key"
            exit 1
          fi

          # Must be 3072-bit with exponent 3 (SGX SIGSTRUCT requirements)
          KEY_INFO=$(openssl rsa -in "$KEY" -noout -text 2>/dev/null)
          BIT_LEN=$(echo "$KEY_INFO" | head -1 | sed 's/[^0-9]*//' | cut -d' ' -f1)
          EXPONENT=$(echo "$KEY_INFO" | grep publicExponent | sed 's/.*: \([0-9]*\).*/\1/')

          if [[ "$BIT_LEN" != "3072" ]]; then
            echo "::error::Signing key must be 3072-bit RSA, got: ${BIT_LEN}-bit"
            exit 1
          fi

          if [[ "$EXPONENT" != "3" ]]; then
            echo "::error::Signing key must have exponent 3, got: $EXPONENT"
            exit 1
          fi

          echo "✓ Valid 3072-bit RSA key with exponent 3"

      - name: Stage AVS RA-TLS trust anchor into build context
        # The Dockerfile bakes /app/avs-ca.crt into the image and measures it
        # into MRENCLAVE via sgx.trusted_files. The cert is public (only the
        # matching avs-tls.key is sensitive), but we still load it from a GH
        # secret so rotation goes through the same review/audit path as other
        # release-affecting changes.
        env:
          AVS_TLS_CRT: ${{ secrets.AVS_TLS_CRT }}
        run: |
          if [ -z "${AVS_TLS_CRT:-}" ]; then
            echo "::error::AVS_TLS_CRT secret is not set. Generate it by base64-decoding the AVS host's secrets/avs-tls.crt and storing the PEM contents in the AVS_TLS_CRT GitHub Actions secret."
            exit 1
          fi
          printenv AVS_TLS_CRT > avs-ca.crt
          if ! openssl x509 -in avs-ca.crt -noout -subject -issuer -dates; then
            echo "::error::AVS_TLS_CRT does not parse as a PEM X.509 certificate."
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/staging' && 'ghcr.io/relational-network/relational-sdk:staging-latest' || '' }}
          cache-from: type=gha,scope=relational-sdk-sgx
          cache-to: type=gha,scope=relational-sdk-sgx,mode=max
          secret-files: |
            sgx-key=${{ runner.temp }}/enclave-key.pem

      - name: Print measurements to job summary
        run: |
          docker run --rm \
            --entrypoint gramine-sgx-sigstruct-view \
            "${IMAGE_TAG}" \
            /app/relational-sdk.sig | tee "$RUNNER_TEMP/relational-sdk.sigstruct.txt"

          {
            echo "## Enclave Measurements"
            echo '```text'
            cat "$RUNNER_TEMP/relational-sdk.sigstruct.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signed enclave settings
        run: |
          SIGSTRUCT="$RUNNER_TEMP/relational-sdk.sigstruct.txt"
          DEBUG_ENCLAVE=$(awk '/debug_enclave:/ {print $2; exit}' "$SIGSTRUCT")
          ISV_PROD_ID=$(awk '/isv_prod_id:/ {print $2; exit}' "$SIGSTRUCT")
          ISV_SVN=$(awk '/isv_svn:/ {print $2; exit}' "$SIGSTRUCT")

          if [ "$DEBUG_ENCLAVE" != "False" ]; then
            echo "::error::Production Docker build must produce a non-debug enclave (got debug_enclave=$DEBUG_ENCLAVE)"
            exit 1
          fi

          if [ "$ISV_PROD_ID" != "0" ]; then
            echo "::error::Expected isv_prod_id=0, got $ISV_PROD_ID"
            exit 1
          fi

          if [ "$ISV_SVN" != "0" ]; then
            echo "::error::Expected isv_svn=0, got $ISV_SVN"
            exit 1
          fi

          echo "✓ debug_enclave=False, isv_prod_id=0, isv_svn=0"

      - name: Verify MRENCLAVE matches measurements.toml
        run: |
          BUILT_MR=$(awk '/mr_enclave:/ {print $2; exit}' "$RUNNER_TEMP/relational-sdk.sigstruct.txt")
          EXPECTED_MR=$(sed -n 's/^mr_enclave = "\(.*\)"$/\1/p' measurements.toml | head -1)

          echo "Built:    $BUILT_MR"
          echo "Expected: $EXPECTED_MR  (measurements.toml)"

          if ! printf '%s\n' "$EXPECTED_MR" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::warning::measurements.toml does not yet contain a pinned mr_enclave. Update it before the first release."
            exit 0
          fi

          if [ "$BUILT_MR" != "$EXPECTED_MR" ]; then
            echo "::error::MRENCLAVE changed!"
            echo "::error::Built:    $BUILT_MR"
            echo "::error::Expected: $EXPECTED_MR"
            echo "If intentional, update measurements.toml in the same PR."
            exit 1
          fi
          echo "✓ MRENCLAVE matches measurements.toml"

      - name: Record image digest
        if: github.event_name == 'push'
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}" | cut -d@ -f2)

          {
            echo "## Container Image"
            echo '```'
            echo "Tag:    ${IMAGE_TAG}"
            echo "Digest: ${DIGEST}"
            echo "Deploy: ghcr.io/relational-network/relational-sdk@${DIGEST}"
            echo '```'
            echo ""
            echo "> **Deploy by digest, not by tag.** Use the \`Deploy\` reference above"
            echo "> to pin the exact image content alongside the MRENCLAVE measurement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Shred signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/enclave-key.pem" 2>/dev/null || true

  # ── Deploy to staging ──────────────────────────────────────────────────────
  # Called directly after build-docker succeeds on push to staging.
  # Uses workflow_call so the CD file is always from the same commit as CI
  deploy-staging:
    name: Deploy to Staging
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/cd-staging.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets: inherit
